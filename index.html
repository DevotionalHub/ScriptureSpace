<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- App branding -->
    <meta name="theme-color" content="#f5f1ea" />
    <meta name="color-scheme" content="light" />
    <meta name="application-name" content="Scripture Space" />

    />

      href="/scripture-space-favicon.svg"
    />

    <link
      rel="apple-touch-icon"
      href="/scripture-space-favicon.svg"
    />
