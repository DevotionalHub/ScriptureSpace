<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#172554" />
    <meta
      name="description"
      content="Private Scripture Space administrator dashboard."
    />

    <link
      rel="icon"
      type="image/png"
      href="https://res.cloudinary.com/nylncw2s/image/upload/v1790778206/ChatGPT_Image_Sep_30_2026_03_22_51_PM.png"
    />

    <link
      rel="apple-touch-icon"
      href="https://res.cloudinary.com/nylncw2s/image/upload/v1790778206/ChatGPT_Image_Sep_30_2026_03_22_51_PM.png"
    />

    <title>Admin · Scripture Space</title>

    <style>
      :root {
        --navy: #172554;
        --gold: #d4a72c;
        --cream: #fafaf7;
        --gray: #e5e7eb;
        --charcoal: #1f2937;
        --muted: #6b7280;
        --success: #55742e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--charcoal);
        background: var(--cream);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      button,
      a {
        font: inherit;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .admin-shell {
        min-height: 100vh;
      }

      .admin-topbar {
        height: 76px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 clamp(20px, 5vw, 72px);
        color: #ffffff;
        background: var(--navy);
      }

      .admin-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 17px;
        font-weight: 700;
      }

      .admin-brand img {
        width: 36px;
        height: 36px;
        object-fit: contain;
        border-radius: 9px;
        background: #ffffff;
      }

      .admin-brand span span {
        color: #cbd5e1;
        font-weight: 400;
      }

      .admin-top-actions {
        display: flex;
        align-items: center;
        gap: 18px;
        color: #e5e7eb;
        font-size: 12px;
      }

      .admin-top-actions button {
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 5px;
        padding: 8px 12px;
        color: #ffffff;
        background: transparent;
        cursor: pointer;
      }

      .admin-top-actions button:hover {
        border-color: var(--gold);
        color: var(--gold);
      }

      .admin-main {
        width: min(1180px, calc(100% - 40px));
        margin: 0 auto;
        padding: 46px 0 70px;
      }

      .admin-heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 28px;
      }

      .admin-heading small {
        display: block;
        margin-bottom: 9px;
        color: #8b6a12;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }

      h1,
      h2,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 8px;
        color: var(--navy);
        font-family: Georgia, serif;
        font-size: clamp(30px, 4vw, 46px);
        font-weight: 400;
        letter-spacing: -1.8px;
      }

      .admin-heading p {
        margin: 0;
        color: var(--muted);
        font-family: Georgia, serif;
        font-size: 15px;
      }

      .admin-date {
        padding: 9px 12px;
        border: 1px solid var(--gray);
        border-radius: 6px;
        color: var(--muted);
        background: #ffffff;
        font-size: 11px;
      }

      .stat-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 13px;
        margin-bottom: 20px;
      }

      .stat-card {
        padding: 19px;
        border: 1px solid var(--gray);
        border-radius: 9px;
        background: #ffffff;
      }

      .stat-card span {
        display: block;
        color: #9ca3af;
        font-size: 10px;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }

      .stat-card strong {
        display: block;
        margin: 9px 0 4px;
        color: var(--navy);
        font-size: 29px;
        letter-spacing: -1px;
      }

      .stat-card small {
        color: var(--success);
        font-size: 10px;
      }

      .panel-grid {
        display: grid;
        grid-template-columns: 1.35fr 0.9fr;
        gap: 14px;
        margin-bottom: 14px;
      }

      .panel {
        padding: 22px;
        border: 1px solid var(--gray);
        border-radius: 9px;
        background: #ffffff;
      }

      .panel-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 22px;
      }

      .panel-heading small {
        display: block;
        margin-bottom: 6px;
        color: #9ca3af;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .panel-heading h2 {
        margin: 0;
        color: var(--navy);
        font-size: 17px;
      }

      .panel-heading select {
        border: 1px solid var(--gray);
        border-radius: 5px;
        padding: 7px;
        color: var(--muted);
        background: var(--cream);
        font-size: 10px;
      }

      .chart {
        height: 190px;
        display: flex;
        align-items: flex-end;
        gap: 13px;
        padding: 16px 7px 0;
        border-bottom: 1px solid var(--gray);
        background: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 45px,
          #f3f4f6 46px
        );
      }

      .chart-bar {
        flex: 1;
        min-width: 10px;
        border-radius: 5px 5px 0 0;
        background: linear-gradient(to top, var(--navy), #5069a6);
      }

      .chart-bar:nth-child(2n) {
        background: linear-gradient(to top, #b88616, var(--gold));
      }

      .chart-labels {
        display: flex;
        justify-content: space-between;
        padding-top: 9px;
        color: #9ca3af;
        font-size: 9px;
      }

      .activity-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .activity-item {
        display: flex;
        align-items: center;
        gap: 11px;
      }

      .activity-icon {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        color: var(--navy);
        background: #e8ecf7;
        font-size: 13px;
      }

      .activity-copy {
        flex: 1;
        min-width: 0;
      }

      .activity-copy strong,
      .activity-copy small {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .activity-copy strong {
        color: var(--charcoal);
        font-size: 11px;
      }

      .activity-copy small {
        margin-top: 3px;
        color: #9ca3af;
        font-size: 9px;
      }

      .visits-panel {
        padding-bottom: 10px;
      }

      .live-badge {
        display: flex;
        align-items: center;
        gap: 5px;
        color: var(--success);
        font-size: 10px;
      }

      .live-badge i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #79a83f;
      }

      .visit-head,
      .visit-row {
        display: grid;
        grid-template-columns: 1.45fr 1.2fr 1fr 0.7fr;
        align-items: center;
        gap: 13px;
      }

      .visit-head {
        padding: 0 8px 10px;
        border-bottom: 1px solid var(--gray);
        color: #9ca3af;
        font-size: 9px;
        letter-spacing: 0.7px;
        text-transform: uppercase;
      }

      .visit-row {
        min-height: 56px;
        padding: 7px 8px;
        border-bottom: 1px solid #f3f4f6;
        color: var(--muted);
        font-size: 10px;
      }

      .visitor {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .visitor-avatar {
        width: 27px;
        height: 27px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: #ffffff;
        background: var(--navy);
        font-size: 9px;
        font-weight: 700;
      }

      .visitor strong {
        display: block;
        color: var(--charcoal);
        font-size: 10px;
      }

      .visitor small {
        display: block;
        margin-top: 2px;
        color: #9ca3af;
        font-size: 8px;
      }

      .empty-state {
        padding: 30px;
        border: 1px dashed var(--gray);
        border-radius: 8px;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }

      .denied {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 30px;
        background: var(--navy);
      }

      .denied-card {
        max-width: 420px;
        padding: 34px;
        border-radius: 12px;
        text-align: center;
        background: var(--cream);
      }

      .denied-card h1 {
        font-size: 30px;
      }

      .denied-card p {
        color: var(--muted);
        line-height: 1.5;
      }

      .denied-card a {
        display: inline-block;
        margin-top: 12px;
        padding: 11px 15px;
        border-radius: 6px;
        color: var(--navy);
        background: var(--gold);
        font-size: 11px;
        font-weight: 700;
      }

      @media (max-width: 850px) {
        .stat-grid {
          grid-template-columns: repeat(2, 1fr);
        }

        .panel-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 560px) {
        .admin-main {
          width: calc(100% - 28px);
          padding-top: 30px;
        }

        .admin-heading {
          align-items: flex-start;
          flex-direction: column;
        }

        .admin-date {
          align-self: stretch;
        }

        .visit-head {
          display: none;
        }

        .visit-row {
          grid-template-columns: 1.3fr 1fr;
          gap: 7px;
        }

        .visit-row > span:nth-child(3),
        .visit-row > span:nth-child(4) {
          display: none;
        }

        .admin-top-actions span {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="admin-root"></div>

    <script type="module" src="/src/admin-entry.js"></script>
  </body>
</html>
